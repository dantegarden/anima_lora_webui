[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:code-server]
command=/usr/bin/code-server --bind-addr 0.0.0.0:%(ENV_CODE_SERVER_PORT)s --auth %(ENV_CODE_SERVER_AUTH)s /workspace/anima_lora_webui
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:webui]
directory=/workspace/anima_lora_webui
command=/workspace/anima_lora_webui/.venv/bin/python tasks.py web --host %(ENV_WEBUI_HOST)s --port %(ENV_WEBUI_PORT)s
autorestart=true
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
